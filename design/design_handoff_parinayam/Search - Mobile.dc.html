<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #E9EBF0; }
    * { box-sizing: border-box; }
    .pn-scroll-x::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div data-screen-label="Search — Mobile" style="width: 390px; min-height: 844px; margin: 0 auto; background: #F7F8FA; font-family: 'Plus Jakarta Sans', sans-serif; color: #1A2233; box-shadow: 0 0 60px rgba(20,39,95,0.12); display: flex; flex-direction: column; position: relative;">

  <!-- HEADER + SEARCH -->
  <header style="background: #ffffff; padding: 16px 20px 14px; border-bottom: 1px solid #EEF0F4; position: sticky; top: 0; z-index: 10;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
      <div style="font-size: 20px; font-weight: 800; color: #14275F;">Search</div>
      <div style="font-size: 12.5px; font-weight: 700; color: #1E3A8A;">248 matches</div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 13px 16px; border: 1.5px solid #E4E8EF; border-radius: 13px; background: #F7F8FA; color: #8A93A6; font-size: 14px;">🔍 Name, profession, district…</div>
      <button style="width: 48px; height: 48px; border-radius: 13px; border: none; background: #1E3A8A; color: #ffffff; font-size: 17px; font-family: inherit; box-shadow: 0 6px 16px rgba(30,58,138,0.3); position: relative;">⚙<span style="position: absolute; top: -4px; right: -4px; width: 17px; height: 17px; border-radius: 999px; background: #E8936B; color: #ffffff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center;">4</span></button>
    </div>
  </header>

  <!-- FILTER CHIPS -->
  <div class="pn-scroll-x" style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px 4px; scrollbar-width: none;">
    <span style="flex-shrink: 0; padding: 9px 16px; border-radius: 999px; background: #1E3A8A; color: #ffffff; font-size: 12.5px; font-weight: 700; white-space: nowrap;">Age 26–34 ✕</span>
    <span style="flex-shrink: 0; padding: 9px 16px; border-radius: 999px; background: #1E3A8A; color: #ffffff; font-size: 12.5px; font-weight: 700; white-space: nowrap;">Ernakulam ✕</span>
    <span style="flex-shrink: 0; padding: 9px 16px; border-radius: 999px; background: #1E3A8A; color: #ffffff; font-size: 12.5px; font-weight: 700; white-space: nowrap;">No dosham ✕</span>
    <span style="flex-shrink: 0; padding: 9px 16px; border-radius: 999px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #5A6472; font-size: 12.5px; font-weight: 600; white-space: nowrap;">＋ More filters</span>
  </div>

  <!-- SORT ROW -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 4px;">
    <div style="font-size: 12.5px; color: #8A93A6; font-weight: 600;">Sorted by <b style="color: #14275F;">Best match</b> ▾</div>
    <div style="display: flex; background: #ffffff; border: 1.5px solid #E4E8EF; border-radius: 10px; overflow: hidden;">
      <span style="padding: 7px 12px; background: #EEF2FB; color: #1E3A8A; font-size: 12px;">▦</span>
      <span style="padding: 7px 12px; color: #8A93A6; font-size: 12px;">☰</span>
    </div>
  </div>

  <!-- RESULTS -->
  <main style="flex: 1; padding: 12px 20px 120px; display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{ results }}" as="p" hint-placeholder-count="5">
      <div style="background: #ffffff; border-radius: 18px; border: 1px solid #EEF0F4; overflow: hidden; display: flex; position: relative; box-shadow: 0 4px 16px rgba(20,39,95,0.05);">
        <div style="position: relative; flex-shrink: 0;">
          <image-slot id="m{{ p.slotId }}" shape="rect" placeholder="photo" style="width: 124px; height: 156px; display: block;"></image-slot>
          <sc-if value="{{ p.online }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: 8px; left: 8px; width: 10px; height: 10px; border-radius: 50%; background: #0E9F6E; border: 2px solid #ffffff;"></div>
          </sc-if>
        </div>
        <div style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 15px; font-weight: 800; color: #14275F; white-space: nowrap;">{{ p.name }}, {{ p.age }}</span>
            <span style="width: 15px; height: 15px; border-radius: 50%; background: #1E3A8A; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 8px;">✓</span>
            <sc-if value="{{ p.premium }}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; color: #C19A3F;">★</span>
            </sc-if>
          </div>
          <div style="font-size: 12.5px; color: #5A6472; margin-top: 3px;">{{ p.job }}</div>
          <div style="font-size: 11.5px; color: #8A93A6; margin-top: 2px;">{{ p.height }} · {{ p.place }}</div>
          <div style="display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;">
            <span style="background: #EEF2FB; color: #1E3A8A; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 800;">{{ p.match }}% match</span>
          </div>
          <div style="display: flex; gap: 8px; margin-top: auto; padding-top: 10px;">
            <button style="flex: 1; padding: 9px 0; border-radius: 10px; border: none; background: #1E3A8A; color: #ffffff; font-weight: 700; font-size: 12.5px; font-family: inherit;">♥ Interest</button>
            <button style="width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #5A6472; font-family: inherit; font-size: 13px;">☆</button>
          </div>
        </div>
      </div>
    </sc-for>

    <button style="margin: 8px auto 0; padding: 13px 32px; border-radius: 12px; border: 1.5px solid #D7DCE6; background: #ffffff; color: #1E3A8A; font-weight: 700; font-size: 14px; font-family: inherit;">Load more profiles</button>
  </main>

  <!-- FLOATING FILTER FAB -->
  <button style="position: sticky; bottom: 108px; margin-left: auto; margin-right: 20px; padding: 14px 22px; border-radius: 999px; border: none; background: #14275F; color: #ffffff; font-weight: 800; font-size: 14px; font-family: inherit; box-shadow: 0 14px 34px rgba(20,39,95,0.4); display: flex; align-items: center; gap: 8px; z-index: 15; width: fit-content;">⚙ Filters · 4</button>

  <!-- BOTTOM NAV -->
  <nav style="position: sticky; bottom: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(14px); border-top: 1px solid #EEF0F4; display: grid; grid-template-columns: repeat(5, 1fr); padding: 10px 8px 22px; z-index: 20; margin-top: -60px;">
    <div style="text-align: center; color: #8A93A6;"><div style="font-size: 19px;">⌂</div><div style="font-size: 10.5px; font-weight: 600; margin-top: 2px;">Home</div></div>
    <div style="text-align: center; color: #1E3A8A;"><div style="font-size: 19px;">🔍</div><div style="font-size: 10.5px; font-weight: 800; margin-top: 2px;">Search</div></div>
    <div style="text-align: center; margin-top: -26px;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #C19A3F, #E3C57A); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto; box-shadow: 0 10px 24px rgba(193,154,63,0.45); border: 4px solid #F7F8FA;">♥</div>
      <div style="font-size: 10.5px; font-weight: 700; color: #8A93A6; margin-top: 3px;">Matches</div>
    </div>
    <div style="text-align: center; color: #8A93A6;"><div style="font-size: 19px;">💬</div><div style="font-size: 10.5px; font-weight: 600; margin-top: 2px;">Inbox</div></div>
    <div style="text-align: center; color: #8A93A6;"><div style="font-size: 19px;">👤</div><div style="font-size: 10.5px; font-weight: 600; margin-top: 2px;">Profile</div></div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390}}">
class Component extends DCLogic {
  renderVals() {
    return {
      results: [
        { slotId: 'sr-1', name: 'Arjun N', age: 29, job: 'Chartered Accountant', height: '5\'9"', place: 'Thrissur', match: 92, premium: true, online: true },
        { slotId: 'sr-2', name: 'Kiran P', age: 31, job: 'Civil Engineer, Dubai', height: '5\'11"', place: 'Kozhikode', match: 89, premium: false, online: false },
        { slotId: 'sr-3', name: 'Sreejith M', age: 30, job: 'Bank Manager', height: '5\'8"', place: 'Kottayam', match: 87, premium: true, online: true },
        { slotId: 'sr-4', name: 'Vishnu P', age: 30, job: 'Government Officer', height: '5\'10"', place: 'Trivandrum', match: 85, premium: false, online: false },
        { slotId: 'sr-5', name: 'Hari K', age: 28, job: 'Software Architect', height: '5\'7"', place: 'Palakkad', match: 84, premium: false, online: true }
      ]
    };
  }
}
</script>
</body>
</html>
