<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #E9EBF0; }
    * { box-sizing: border-box; }
    .pn-scroll-x::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div data-screen-label="Notifications — Mobile" style="width: 390px; min-height: 844px; margin: 0 auto; background: #F7F8FA; font-family: 'Plus Jakarta Sans', sans-serif; color: #1A2233; box-shadow: 0 0 60px rgba(20,39,95,0.12); display: flex; flex-direction: column;">

  <header style="background: #ffffff; padding: 16px 20px 12px; border-bottom: 1px solid #EEF0F4; position: sticky; top: 0; z-index: 10;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button style="width: 38px; height: 38px; border-radius: 10px; border: none; background: #F3F5F9; color: #14275F; font-size: 15px; font-family: inherit;">←</button>
        <div style="font-size: 18px; font-weight: 800; color: #14275F;">Notifications</div>
      </div>
      <span style="font-size: 12.5px; font-weight: 700; color: #1E3A8A;">Mark all read</span>
    </div>
    <div class="pn-scroll-x" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;">
      <span style="flex-shrink: 0; padding: 8px 16px; border-radius: 999px; background: #1E3A8A; color: #ffffff; font-size: 12.5px; font-weight: 700;">All</span>
      <span style="flex-shrink: 0; padding: 8px 16px; border-radius: 999px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #5A6472; font-size: 12.5px; font-weight: 600;">Interests</span>
      <span style="flex-shrink: 0; padding: 8px 16px; border-radius: 999px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #5A6472; font-size: 12.5px; font-weight: 600;">Views</span>
      <span style="flex-shrink: 0; padding: 8px 16px; border-radius: 999px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #5A6472; font-size: 12.5px; font-weight: 600;">Account</span>
    </div>
  </header>

  <main style="flex: 1; padding: 16px 20px 40px;">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="font-size: 12px; font-weight: 800; color: #8A93A6; letter-spacing: 0.08em; text-transform: uppercase; margin: 18px 0 10px;">{{ g.label }}</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="3">
          <div style="background: {{ n.bg }}; border: 1px solid #EEF0F4; border-radius: 16px; padding: 14px 16px; display: flex; gap: 13px; align-items: flex-start;">
            <div style="width: 38px; height: 38px; border-radius: 50%; background: {{ n.ibg }}; color: {{ n.ifg }}; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;">{{ n.icon }}</div>
            <div style="flex: 1;">
              <div style="font-size: 13.5px; color: #1A2233; line-height: 1.5;">{{ n.text }}</div>
              <div style="font-size: 11.5px; color: #8A93A6; margin-top: 3px;">{{ n.when }}</div>
              <sc-if value="{{ n.actions }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; gap: 8px; margin-top: 11px;">
                  <button style="flex: 1; padding: 10px 0; border-radius: 10px; border: none; background: #0E9F6E; color: #ffffff; font-weight: 700; font-size: 12px; font-family: inherit;">✓ Accept</button>
                  <button style="flex: 1; padding: 10px 0; border-radius: 10px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #5A6472; font-weight: 700; font-size: 12px; font-family: inherit;">Decline</button>
                </div>
              </sc-if>
            </div>
            <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1E3A8A; margin-top: 6px; flex-shrink: 0;"></span></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390}}">
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { label: 'Today', items: [
          { icon: '♥', ibg: '#FBEFE6', ifg: '#C05A2E', text: 'Devika K sent you an interest', when: '12 min ago', unread: true, actions: true, bg: '#FBFCFE' },
          { icon: '👁', ibg: '#EEF2FB', ifg: '#1E3A8A', text: 'Kiran P viewed your profile', when: '1 hr ago', unread: true, actions: false, bg: '#FBFCFE' },
          { icon: '✓', ibg: '#E6F6EF', ifg: '#0E9F6E', text: 'Arjun N accepted your interest — you can now chat', when: '3 hr ago', unread: true, actions: false, bg: '#FBFCFE' }
        ]},
        { label: 'Yesterday', items: [
          { icon: '🛡', ibg: '#E6F6EF', ifg: '#0E9F6E', text: 'Identity verification approved — badge is live', when: '4:20 PM', unread: false, actions: false, bg: '#ffffff' },
          { icon: '★', ibg: '#F6EFDD', ifg: '#9A6B2F', text: 'Sreejith M shortlisted your profile', when: '11:05 AM', unread: false, actions: false, bg: '#ffffff' }
        ]},
        { label: 'Earlier', items: [
          { icon: '⏳', ibg: '#FDECEC', ifg: '#C0392B', text: 'Premium renews in 30 days', when: 'Tuesday', unread: false, actions: false, bg: '#ffffff' }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
