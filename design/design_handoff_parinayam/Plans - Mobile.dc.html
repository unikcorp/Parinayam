<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #E9EBF0; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div data-screen-label="Membership Plans — Mobile" style="width: 390px; min-height: 844px; margin: 0 auto; background: #F7F8FA; font-family: 'Plus Jakarta Sans', sans-serif; color: #1A2233; box-shadow: 0 0 60px rgba(20,39,95,0.12); display: flex; flex-direction: column;">

  <header style="background: #ffffff; padding: 16px 20px; border-bottom: 1px solid #EEF0F4; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10;">
    <button style="width: 38px; height: 38px; border-radius: 10px; border: none; background: #F3F5F9; color: #14275F; font-size: 15px; font-family: inherit;">←</button>
    <div style="font-size: 18px; font-weight: 800; color: #14275F;">Membership</div>
  </header>

  <main style="flex: 1; padding: 24px 20px 120px;">
    <h1 style="font-size: 25px; font-weight: 800; letter-spacing: -0.02em; color: #14275F; margin: 0 0 8px; text-align: center;">Choose your plan</h1>
    <p style="font-size: 13.5px; color: #5A6472; margin: 0 0 18px; text-align: center;">Cancel anytime · Verified-only browsing</p>

    <div style="display: flex; gap: 4px; background: #ffffff; border: 1.5px solid #E4E8EF; padding: 4px; border-radius: 999px; margin-bottom: 24px;">
      <span style="flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; color: #5A6472; font-size: 12.5px; font-weight: 600;">3 mo</span>
      <span style="flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; background: #1E3A8A; color: #ffffff; font-size: 12.5px; font-weight: 700;">6 mo −20%</span>
      <span style="flex: 1; text-align: center; padding: 9px 0; border-radius: 999px; color: #5A6472; font-size: 12.5px; font-weight: 600;">12 mo</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <sc-for list="{{ plans }}" as="plan" hint-placeholder-count="3">
        <div style="background: {{ plan.bg }}; color: {{ plan.fg }}; border-radius: 20px; padding: 24px 22px; border: {{ plan.border }}; position: relative; box-shadow: {{ plan.shadow }};">
          <sc-if value="{{ plan.popular }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: -12px; left: 22px; background: linear-gradient(135deg, #C19A3F, #E3C57A); color: #ffffff; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; padding: 5px 14px; border-radius: 999px;">MOST POPULAR</div>
          </sc-if>
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75;">{{ plan.name }}</div>
            <div style="display: flex; align-items: baseline; gap: 4px;">
              <span style="font-size: 27px; font-weight: 800; letter-spacing: -0.02em;">{{ plan.price }}</span>
              <span style="font-size: 12px; opacity: 0.7;">{{ plan.per }}</span>
            </div>
          </div>
          <div style="font-size: 12.5px; opacity: 0.75; margin: 6px 0 14px;">{{ plan.tagline }}</div>
          <div style="display: flex; flex-direction: column; gap: 9px;">
            <sc-for list="{{ plan.features }}" as="f" hint-placeholder-count="4">
              <div style="display: flex; gap: 9px; align-items: center; font-size: 13.5px; font-weight: 500;"><span style="color: #0E9F6E; font-weight: 800;">✓</span> {{ f }}</div>
            </sc-for>
          </div>
          <button style="width: 100%; margin-top: 18px; padding: 14px 0; border-radius: 13px; border: {{ plan.btnBorder }}; background: {{ plan.btnBg }}; color: {{ plan.btnFg }}; font-weight: 800; font-size: 15px; font-family: inherit;">{{ plan.cta }}</button>
        </div>
      </sc-for>
    </div>

    <!-- COMPARISON (condensed) -->
    <h2 style="font-size: 18px; font-weight: 800; color: #14275F; margin: 30px 0 14px;">Compare features</h2>
    <div style="background: #ffffff; border-radius: 18px; border: 1px solid #EEF0F4; overflow: hidden;">
      <div style="display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; padding: 13px 16px; background: #F7F8FA; border-bottom: 1px solid #EEF0F4; font-size: 11px; font-weight: 800;">
        <span style="color: #8A93A6; text-transform: uppercase;">Feature</span>
        <span style="color: #14275F; text-align: center;">Free</span>
        <span style="color: #C19A3F; text-align: center;">★ Prem</span>
        <span style="color: #14275F; text-align: center;">♛ Elite</span>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; padding: 12px 16px; border-bottom: 1px solid #F5F6F9; align-items: center;">
          <span style="font-size: 12px; font-weight: 600; color: #1A2233;">{{ r.f }}</span>
          <span style="font-size: 12px; text-align: center; color: {{ r.c1 }}; font-weight: 700;">{{ r.v1 }}</span>
          <span style="font-size: 12px; text-align: center; color: {{ r.c2 }}; font-weight: 700; background: #FDF9F4; padding: 5px 0; border-radius: 7px;">{{ r.v2 }}</span>
          <span style="font-size: 12px; text-align: center; color: {{ r.c3 }}; font-weight: 700;">{{ r.v3 }}</span>
        </div>
      </sc-for>
    </div>
  </main>

  <!-- STICKY CTA -->
  <div style="position: sticky; bottom: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(14px); border-top: 1px solid #EEF0F4; padding: 12px 20px 22px; z-index: 20;">
    <button style="width: 100%; padding: 16px 0; border-radius: 13px; border: none; background: linear-gradient(135deg, #C19A3F, #E3C57A); color: #ffffff; font-weight: 800; font-size: 15.5px; font-family: inherit; box-shadow: 0 10px 24px rgba(193,154,63,0.4);">Go Premium — ₹4,700 / 6 mo</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390}}">
class Component extends DCLogic {
  renderVals() {
    return {
      plans: [
        { name: 'Free', price: '₹0', per: 'forever', tagline: 'Browse and get discovered', popular: false,
          bg: '#ffffff', fg: '#1A2233', border: '1px solid #EEF0F4', shadow: 'none',
          btnBg: '#ffffff', btnFg: '#1E3A8A', btnBorder: '1.5px solid #D7DCE6', cta: 'Current plan',
          features: ['Create a full profile', 'Browse verified profiles', '5 interests per month'] },
        { name: 'Premium', price: '₹4,700', per: '/ 6 mo', tagline: 'Everything you need to connect', popular: true,
          bg: '#14275F', fg: '#ffffff', border: '1px solid #14275F', shadow: '0 18px 40px rgba(20,39,95,0.28)',
          btnBg: 'linear-gradient(135deg, #C19A3F, #E3C57A)', btnFg: '#ffffff', btnBorder: 'none', cta: 'Go Premium',
          features: ['Unlimited interests & chat', 'View 100 contact numbers', 'See who visited you', 'Horoscope match reports'] },
        { name: 'Elite', price: '₹12,900', per: '/ 6 mo', tagline: 'Personal matchmaking assistance', popular: false,
          bg: '#ffffff', fg: '#1A2233', border: '1.5px solid #E3C57A', shadow: 'none',
          btnBg: '#1E3A8A', btnFg: '#ffffff', btnBorder: 'none', cta: 'Talk to us',
          features: ['Everything in Premium', 'Dedicated relationship manager', 'Handpicked weekly matches'] }
      ],
      rows: [
        { f: 'Browse profiles', v1: '✓', v2: '✓', v3: '✓', c1: '#0E9F6E', c2: '#0E9F6E', c3: '#0E9F6E' },
        { f: 'Interests', v1: '5/mo', v2: '∞', v3: '∞', c1: '#5A6472', c2: '#0E9F6E', c3: '#0E9F6E' },
        { f: 'Chat & voice', v1: '—', v2: '✓', v3: '✓', c1: '#B3BAC7', c2: '#0E9F6E', c3: '#0E9F6E' },
        { f: 'Contact numbers', v1: '—', v2: '100', v3: '∞', c1: '#B3BAC7', c2: '#5A6472', c3: '#0E9F6E' },
        { f: 'Who visited you', v1: '—', v2: '✓', v3: '✓', c1: '#B3BAC7', c2: '#0E9F6E', c3: '#0E9F6E' },
        { f: 'Horoscope reports', v1: '—', v2: '✓', v3: '✓+', c1: '#B3BAC7', c2: '#0E9F6E', c3: '#0E9F6E' },
        { f: 'Relationship manager', v1: '—', v2: '—', v3: '✓', c1: '#B3BAC7', c2: '#B3BAC7', c3: '#0E9F6E' }
      ]
    };
  }
}
</script>
</body>
</html>
