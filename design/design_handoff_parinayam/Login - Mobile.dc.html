<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #E9EBF0; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div data-screen-label="Login — Mobile" style="width: 390px; min-height: 844px; margin: 0 auto; background: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; color: #1A2233; box-shadow: 0 0 60px rgba(20,39,95,0.12); display: flex; flex-direction: column;">

  <!-- BRAND HEADER -->
  <div style="background: linear-gradient(160deg, #14275F 0%, #1E3A8A 100%); color: #ffffff; padding: 40px 24px 56px; border-radius: 0 0 32px 32px; position: relative; overflow: hidden;">
    <div style="position: absolute; top: -80px; right: -80px; width: 240px; height: 240px; border-radius: 50%; background: rgba(255,255,255,0.06);"></div>
    <div style="position: absolute; bottom: -60px; left: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(227,197,122,0.1);"></div>
    <div style="display: flex; align-items: center; gap: 11px; position: relative; margin-bottom: 30px;">
      <div style="width: 36px; height: 36px; border-radius: 11px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; color: #F3D68A; font-weight: 800; font-size: 18px;">P</div>
      <div style="font-weight: 800; font-size: 18px;">Parinayam</div>
    </div>
    <h1 style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; position: relative;">Welcome back</h1>
    <p style="font-size: 14.5px; color: #B9C3DD; margin: 0; position: relative;">Sign in to see who's waiting to meet you.</p>
  </div>

  <!-- FORM CARD -->
  <main style="padding: 0 20px 40px; margin-top: -24px; position: relative; flex: 1;">
    <div style="background: #ffffff; border-radius: 20px; box-shadow: 0 16px 44px rgba(20,39,95,0.12); border: 1px solid #F0F1F5; padding: 22px 20px;">
      <div style="display: flex; gap: 4px; background: #F3F5F9; padding: 4px; border-radius: 12px; margin-bottom: 22px;">
        <span style="flex: 1; text-align: center; padding: 11px 0; border-radius: 9px; background: #ffffff; color: #14275F; font-size: 13.5px; font-weight: 700; box-shadow: 0 2px 8px rgba(20,39,95,0.08);">OTP Login</span>
        <span style="flex: 1; text-align: center; padding: 11px 0; border-radius: 9px; color: #5A6472; font-size: 13.5px; font-weight: 600;">Password</span>
      </div>

      <label style="font-size: 12.5px; font-weight: 700; color: #14275F; display: block; margin-bottom: 8px;">Mobile number</label>
      <div style="display: flex; gap: 8px; margin-bottom: 18px;">
        <div style="padding: 14px 12px; border: 1.5px solid #E4E8EF; border-radius: 12px; font-size: 14px; font-weight: 600; color: #1A2233; white-space: nowrap;">🇮🇳 +91</div>
        <div style="flex: 1; padding: 14px 14px; border: 1.5px solid #1E3A8A; border-radius: 12px; font-size: 15px; font-weight: 600; color: #1A2233; box-shadow: 0 0 0 3px #EEF2FB;">98470 12345</div>
      </div>

      <label style="font-size: 12.5px; font-weight: 700; color: #14275F; display: block; margin-bottom: 8px;">Enter OTP</label>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <div style="flex: 1; height: 54px; border: 1.5px solid #E4E8EF; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #14275F;">4</div>
        <div style="flex: 1; height: 54px; border: 1.5px solid #E4E8EF; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #14275F;">7</div>
        <div style="flex: 1; height: 54px; border: 1.5px solid #E4E8EF; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #14275F;">2</div>
        <div style="flex: 1; height: 54px; border: 1.5px solid #1E3A8A; border-radius: 12px; box-shadow: 0 0 0 3px #EEF2FB;"></div>
        <div style="flex: 1; height: 54px; border: 1.5px solid #E4E8EF; border-radius: 12px; background: #F7F8FA;"></div>
        <div style="flex: 1; height: 54px; border: 1.5px solid #E4E8EF; border-radius: 12px; background: #F7F8FA;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 22px;">
        <span style="color: #8A93A6;">Resend in <b style="color: #14275F;">00:24</b></span>
        <a href="#" style="color: #1E3A8A; font-weight: 700; text-decoration: none;">Forgot password?</a>
      </div>

      <button style="width: 100%; padding: 16px 0; border-radius: 13px; border: none; background: #1E3A8A; color: #ffffff; font-weight: 800; font-size: 16px; font-family: inherit; box-shadow: 0 8px 22px rgba(30,58,138,0.3);">Sign in</button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; margin: 26px 0 18px;">
      <div style="flex: 1; height: 1px; background: #EEF0F4;"></div>
      <span style="font-size: 12.5px; color: #8A93A6; font-weight: 600;">or continue with</span>
      <div style="flex: 1; height: 1px; background: #EEF0F4;"></div>
    </div>

    <div style="display: flex; gap: 10px;">
      <button style="flex: 1; padding: 14px 0; border-radius: 13px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #1A2233; font-weight: 700; font-size: 14px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;"><span style="width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#4285F4 0 90deg, #34A853 90deg 180deg, #FBBC05 180deg 270deg, #EA4335 270deg 360deg); display: inline-block;"></span> Google</button>
      <button style="flex: 1; padding: 14px 0; border-radius: 13px; border: 1.5px solid #E4E8EF; background: #ffffff; color: #1A2233; font-weight: 700; font-size: 14px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;"> Apple</button>
    </div>

    <div style="text-align: center; font-size: 14px; color: #5A6472; margin-top: 30px;">New to Parinayam? <a href="#" style="color: #1E3A8A; font-weight: 800; text-decoration: none;">Register free →</a></div>
  </main>

  <div style="text-align: center; padding: 0 20px 28px; font-size: 12px; color: #8A93A6;">🔒 Privacy protected · ✓ 100% verified profiles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390}}"></script>
</body>
</html>
