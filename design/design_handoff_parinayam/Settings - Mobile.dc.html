<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #E9EBF0; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div data-screen-label="Settings — Mobile" style="width: 390px; min-height: 844px; margin: 0 auto; background: #F7F8FA; font-family: 'Plus Jakarta Sans', sans-serif; color: #1A2233; box-shadow: 0 0 60px rgba(20,39,95,0.12); display: flex; flex-direction: column;">

  <header style="background: #ffffff; padding: 16px 20px; border-bottom: 1px solid #EEF0F4; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10;">
    <button style="width: 38px; height: 38px; border-radius: 10px; border: none; background: #F3F5F9; color: #14275F; font-size: 15px; font-family: inherit;">←</button>
    <div style="font-size: 18px; font-weight: 800; color: #14275F;">Settings</div>
  </header>

  <main style="flex: 1; padding: 20px 20px 48px;">

    <!-- PROFILE ROW -->
    <div style="background: #ffffff; border-radius: 18px; border: 1px solid #EEF0F4; padding: 16px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
      <image-slot id="mset-avatar" shape="circle" placeholder="you" style="width: 54px; height: 54px; display: block; border: 2px solid #E3C57A; border-radius: 50%;"></image-slot>
      <div style="flex: 1;">
        <div style="font-size: 16px; font-weight: 800; color: #14275F;">Anjali Menon</div>
        <div style="font-size: 12.5px; color: #8A93A6; margin-top: 2px;">PNM-2024-08412 · ★ Premium</div>
      </div>
      <span style="color: #8A93A6;">›</span>
    </div>

    <!-- PRIVACY GROUP -->
    <div style="font-size: 12px; font-weight: 800; color: #8A93A6; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 10px 4px;">Privacy &amp; visibility</div>
    <div style="background: #ffffff; border-radius: 18px; border: 1px solid #EEF0F4; overflow: hidden; margin-bottom: 20px;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-bottom: 1px solid #F5F6F9;">
        <span style="font-size: 16px;">📷</span>
        <div style="flex: 1;">
          <div style="font-size: 14px; font-weight: 700; color: #1A2233;">Photo privacy</div>
          <div style="font-size: 12px; color: #8A93A6; margin-top: 2px;">Visible on request</div>
        </div>
        <span style="color: #8A93A6;">›</span>
      </div>
      <sc-for list="{{ toggles }}" as="t" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-bottom: 1px solid #F5F6F9;">
          <span style="font-size: 16px;">{{ t.icon }}</span>
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 700; color: #1A2233;">{{ t.label }}</div>
            <div style="font-size: 12px; color: #8A93A6; margin-top: 2px;">{{ t.desc }}</div>
          </div>
          <div style="width: 46px; height: 27px; border-radius: 999px; background: {{ t.trackBg }}; position: relative; flex-shrink: 0;">
            <span style="position: absolute; top: 3px; left: {{ t.knobLeft }}; width: 21px; height: 21px; border-radius: 50%; background: #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.2);"></span>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- OTHER GROUPS -->
    <div style="font-size: 12px; font-weight: 800; color: #8A93A6; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 10px 4px;">Account</div>
    <div style="background: #ffffff; border-radius: 18px; border: 1px solid #EEF0F4; overflow: hidden; margin-bottom: 20px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 13px; padding: 16px 18px; border-bottom: 1px solid #F5F6F9;">
          <span style="font-size: 16px;">{{ it.icon }}</span>
          <div style="flex: 1; font-size: 14px; font-weight: 700; color: #1A2233;">{{ it.label }}</div>
          <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="background: #F3F5F9; color: #5A6472; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700;">{{ it.badge }}</span></sc-if>
          <span style="color: #8A93A6;">›</span>
        </div>
      </sc-for>
    </div>

    <!-- DANGER -->
    <div style="background: #ffffff; border-radius: 18px; border: 1px solid #F5D9D6; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 16px 18px; border-bottom: 1px solid #F5F6F9;">
        <span style="font-size: 16px;">⏸</span>
        <div style="flex: 1; font-size: 14px; font-weight: 700; color: #1A2233;">Pause my profile</div>
        <span style="color: #8A93A6;">›</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 16px 18px;">
        <span style="font-size: 16px;">🗑</span>
        <div style="flex: 1; font-size: 14px; font-weight: 700; color: #C0392B;">Delete account</div>
        <span style="color: #8A93A6;">›</span>
      </div>
    </div>

    <div style="text-align: center; font-size: 12px; color: #B3BAC7; margin-top: 24px;">Parinayam v2.4.1 · Signed in as +91 98470 12345</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390}}">
class Component extends DCLogic {
  renderVals() {
    const on = { trackBg: '#0E9F6E', knobLeft: '22px' };
    const off = { trackBg: '#D7DCE6', knobLeft: '3px' };
    return {
      toggles: [
        { icon: '🔍', label: 'Show in search', desc: 'Verified members can find you', ...on },
        { icon: '🟢', label: 'Online status', desc: 'Show when you\u2019re active', ...on },
        { icon: '🕐', label: 'Last active time', desc: 'Show \u201clast active\u201d on profile', ...off },
        { icon: '📱', label: 'Hide from contacts', desc: 'Hide from phone contacts', ...off }
      ],
      items: [
        { icon: '🔔', label: 'Notification settings', badge: '' },
        { icon: '🚫', label: 'Blocked users', badge: '2' },
        { icon: '🔑', label: 'Password & security', badge: '' },
        { icon: '★', label: 'Membership & billing', badge: 'Premium' },
        { icon: '🌐', label: 'Language', badge: 'English' }
      ]
    };
  }
}
</script>
</body>
</html>
